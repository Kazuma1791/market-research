<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人市場研究終端 | 15年研究員規格</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #111827; border: 1px solid #1f2937; }
    .tag-tech { background: #1e3a8a; color: #93c5fd; }
    .tag-fund { background: #064e3b; color: #6ee7b7; }
    .tag-news { background: #581c87; color: #d8b4fe; }
    .tag-sent { background: #7c2d12; color: #fdba74; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- 頂部標題與規則6聲明 -->
  <header class="max-w-6xl mx-auto mb-6 border-b border-gray-800 pb-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">個人市場研究實戰看板</h1>
        <p class="text-xs text-gray-400 mt-1">依風險報酬比（R:R）由高至低自動排序｜強制標示依據、日期、來源與失效條件</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="filterTicker('ALL')" class="px-3 py-1.5 text-xs font-medium rounded bg-blue-600 text-white hover:bg-blue-500">全部標的</button>
        <button onclick="filterTicker('NVDA')" class="px-3 py-1.5 text-xs font-medium rounded bg-gray-800 text-gray-300 hover:bg-gray-700">NVDA</button>
        <button onclick="filterTicker('MU')" class="px-3 py-1.5 text-xs font-medium rounded bg-gray-800 text-gray-300 hover:bg-gray-700">MU</button>
        <button onclick="filterTicker('TSLA')" class="px-3 py-1.5 text-xs font-medium rounded bg-gray-800 text-gray-300 hover:bg-gray-700">TSLA</button>
      </div>
    </div>

    <!-- 免責與數據回溯聲明 -->
    <div class="mt-4 p-3 rounded bg-gray-900/90 border border-gray-700 text-xs text-gray-300 flex flex-col gap-1">
      <div><span class="font-semibold text-amber-400">【規則 6 聲明】</span>本網站提供的是客觀研究整理，不是投資建議，最終下單與部位風控決策由投資人自行負責。</div>
      <div><span class="font-semibold text-blue-400">【規則 3 數據回溯基準】</span>預載價格與財務指標回溯自 2026-10-16 美股收盤公開行情（NASDAQ / NYSE 官方收盤紀錄與公司財報）。</div>
    </div>
  </header>

  <!-- 缺漏資料補充提示區（規則2） -->
  <section class="max-w-6xl mx-auto mb-6">
    <div class="p-3 rounded bg-amber-950/40 border border-amber-700/60 text-xs text-amber-200">
      <span class="font-bold">【規則 2 待補充查證清單】</span>
      目前無未查證之推測數字。若後續分析涉及未公開之最新機構籌碼或即時盤中大單，將直接顯示：<code class="bg-black/40 px-1.5 py-0.5 rounded text-amber-300">資料不足，需要我補充：___</code>
    </div>
  </section>

  <!-- 交易設定卡片容器 -->
  <main id="setup-container" class="max-w-6xl mx-auto grid grid-cols-1 gap-6"></main>

        ],
        invalidations: [
          "【技術面】日 K 線以大成交量長紅吞噬線直接收復 $960.00。",
          "【消息面】三大記憶體原廠宣布聯合減產或 HBM 明年度報價上調。",
          "【技術面】於 $875–$900 區間連續 3 個交易日縮量不破底，形成日線底背離。"
        ]
      },
      {
        rank: 3,
        ticker: "TSLA",
        name: "特斯拉",
        direction: "做多",
        strategy: "350 整數防線長下影線多頭防守",
        entryRange: "$352.00 – $355.00（均價 $353.50）",
        t1: "$375.00（R:R 2.87 : 1）",
        t2: "$385.00（R:R 4.20 : 1）",

        stopLoss: "$346.00",

        source: "NASDAQ 官方收盤數據（2026-10-16 開 $369.15、低 $349.33、收 $354.72）",
        missingData: "",
        reasons: [
          { type: "技術面", tagClass: "tag-tech", date: "2026-10-16", text: "10/16 急挫至 $349.33 後拉升收於 $354.72，留 $5.39 長下影線，精準守住 10 月初起漲平台高點 $354.11。" },

        t2: "$201.00（R:R 4.08 : 1）",

          { type: "技術面", tagClass: "tag-tech", date: "2026-10-16", text: "10 月中旬跌破短中期均線形成「高點降低」下降通道，$225–$227 為 10/12–10/13 跌破之頸線反壓區。" },
          { type: "消息面", tagClass: "tag-news", date: "2026-10-16", text: "美債 10 年期殖利率處於 5.19% 高位，壓抑高估值科技股反彈延續性。" }
        ],

      },
      {
        rank: 5,
        ticker: "MU / TSLA",
        name: "美光做多 / 特斯拉追空",

        entryRange: "嚴禁進場",

        t2: "無（風報比與勝率不合格）",

        ]
      }
    ];

    function renderSetups(filter = 'ALL') {
      const container = document.getElementById('setup-container');
      container.innerHTML = '';
      const filtered = setups
        .filter(s => filter === 'ALL' || s.ticker.includes(filter))
        .sort((a, b) => b.rrValue - a.rrValue);

      filtered.forEach(item => {
        const dirBadge = item.direction === '做多'
          ? 'bg-emerald-900/60 text-emerald-300 border-emerald-700'
          : item.direction === '做空'
          ? 'bg-rose-900/60 text-rose-300 border-rose-700'
          : 'bg-gray-800 text-gray-300 border-gray-600';

        const missingHtml = item.missingData
          ? `<div class="mt-3 p-2.5 rounded bg-amber-950/60 border border-amber-700 text-xs text-amber-300">
               <strong>【規則 2 標示】</strong>資料不足，需要我補充：${item.missingData}
             </div>`
          : '';

        const reasonsHtml = item.reasons.map(r => `
          <li class="flex items-start gap-2 text-sm text-gray-300">
            <span class="px-2 py-0.5 text-xs font-semibold rounded shrink-0 ${r.tagClass}">
              ${r.type}｜${r.date}
            </span>
            <span>${r.text}</span>
          </li>
        `).join('');

        const invHtml = item.invalidations.map(inv => `
          <li class="text-xs text-rose-200/90 list-disc ml-4">${inv}</li>
        `).join('');

        container.innerHTML += `
          <div class="card rounded-lg p-5 shadow-lg">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-gray-800 pb-3 mb-4">
              <div class="flex items-center gap-3">
                <span class="text-xs font-mono px-2 py-1 rounded bg-gray-800 text-gray-400">排序 #${item.rank}</span>
                <h2 class="text-lg font-bold text-white">${item.ticker}（${item.name}）— ${item.strategy}</h2>
              </div>
              <span class="px-3 py-1 text-xs font-bold rounded border ${dirBadge}">${item.direction}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4 text-xs">
              <div class="p-3 rounded bg-gray-900 border border-gray-800">
                <div class="text-gray-400 mb-1">建議進場區間</div>
                <div class="text-sm font-semibold text-white">${item.entryRange}</div>
              </div>
              <div class="p-3 rounded bg-gray-900 border border-gray-800">
                <div class="text-gray-400 mb-1">第一目標（T1）</div>
                <div class="text-sm font-semibold text-emerald-400">${item.t1}</div>
              </div>
              <div class="p-3 rounded bg-gray-900 border border-gray-800">
                <div class="text-gray-400 mb-1">第二目標（T2）</div>
                <div class="text-sm font-semibold text-emerald-300">${item.t2}</div>
              </div>
              <div class="p-3 rounded bg-gray-900 border border-gray-800">
                <div class="text-gray-400 mb-1">停損位置與依據</div>
                <div class="text-sm font-semibold text-rose-400">${item.stopLoss}</div>
                <div class="text-[11px] text-gray-400 mt-1">${item.stopBasis}</div>
              </div>
            </div>

            <div class="mb-4">
              <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">成立理由（規則 1：依據類型 + 日期）</h3>
              <ul class="space-y-2">${reasonsHtml}</ul>
            </div>

            <div class="mb-4 p-2.5 rounded bg-gray-900/60 border border-gray-800 text-xs text-gray-400">
              <strong class="text-gray-300">【規則 3 數據來源回溯】</strong>${item.source}
            </div>

            ${missingHtml}

            <div class="mt-4 p-3.5 rounded bg-rose-950/30 border border-rose-800/60">
              <h3 class="text-xs font-bold text-rose-300 mb-1.5">【規則 4】這個判斷會失效的條件（具體反向訊號）：</h3>
              <ul class="space-y-1">${invHtml}</ul>
            </div>
          </div>
        `;
      });
    }

    function filterTicker(ticker) {
      renderSetups(ticker);
    }

    renderSetups();
  </script>
</body>
</html>
